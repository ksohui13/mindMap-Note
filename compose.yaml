services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindmap
      POSTGRES_USER: mindmap
      POSTGRES_PASSWORD: mindmap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmap -d mindmap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mindmap_postgres_data:/var/lib/postgresql/data

volumes:
  mindmap_postgres_data:
